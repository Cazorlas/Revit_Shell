name: CI

# Builds and tests every pull request (Dependabot included) and every push to main. Releases stay in release.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore RevitShell.sln

      - name: Build (Release also builds the MSI)
        run: dotnet build RevitShell.sln -c Release --no-restore

      - name: Test
        run: dotnet test RevitShell.Tests/RevitShell.Tests.csproj -c Release --no-build
